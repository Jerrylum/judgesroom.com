# Deploy the Cloudflare Worker when a v* tag is pushed.
# v2.2.0 → production (judgesroom.com). v2.2.0-beta.1 → beta (beta.judgesroom.com).
# Use "act" to run and test the workflow locally.
# See https://nektosact.com/installation/homebrew.html.
# Under act, github.actor is nektos/act, so deploy is skipped and replaced with wrangler --dry-run.
# echo '{ "ref": "refs/tags/v0.1.0" }' > .event-file.json
# act --eventpath .event-file.json -W .github/workflows/deploy.yml

name: Tagged Deploy Cloudflare Worker

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # Using Node.js as it is required by Wrangler.
        with:
          node-version: 22
      - run: npm install -g bun # Using Bun as it is required by the project.
        # Removing better-sqlite3 as it takes too long to install and is not needed for the workflow.
      - run: bun remove better-sqlite3
      - run: bun install
      - run: bun run build
        working-directory: web
        env:
          CI: false
      - name: Pick Cloudflare environment
        id: cf
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            echo "env=beta" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Worker (act dry-run)
        if: github.actor == 'nektos/act'
        run: bunx wrangler deploy --dry-run --env ${{ steps.cf.outputs.env }}
        working-directory: worker
      - name: Build & Deploy Worker
        if: github.actor != 'nektos/act'
        uses: cloudflare/wrangler-action@v3.12.0 # See https://github.com/cloudflare/wrangler-action/issues/386
        with:
          workingDirectory: ${{ github.workspace }}/worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ steps.cf.outputs.env }}
